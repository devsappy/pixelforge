<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070712" />
    <!-- <title>, description, canonical, Open Graph, and Twitter tags are
         injected per-route by the Seo component (src/components/Seo.tsx). -->

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Site-wide structured data. Per-page title, description, canonical,
         Open Graph, Twitter, and page-specific schema are injected by the
         Seo component (src/components/Seo.tsx) on every route. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://gptshopexpert.com/#org",
            "name": "GPTShopExpert",
            "alternateName": "GPTShopExpert GEO Agency",
            "url": "https://gptshopexpert.com/",
            "logo": "https://gptshopexpert.com/favicon.svg",
            "image": "https://gptshopexpert.com/og-image.svg",
            "description": "A GEO & AEO agency that gets businesses found and cited by AI engines — ChatGPT, Perplexity, Gemini, and Google AI Overviews — through citation audits, schema, llms.txt, content, and GEO-ready websites.",
            "foundingDate": "2021",
            "email": "hello@gptshopexpert.com",
            "areaServed": "Worldwide",
            "knowsAbout": [
              "Generative Engine Optimization",
              "Answer Engine Optimization",
              "AI citations",
              "Technical SEO",
              "Schema.org structured data",
              "llms.txt",
              "Google AI Overviews",
              "ChatGPT",
              "Perplexity",
              "Core Web Vitals"
            ],
            "sameAs": []
          },
          {
            "@type": "WebSite",
            "@id": "https://gptshopexpert.com/#website",
            "url": "https://gptshopexpert.com/",
            "name": "GPTShopExpert",
            "publisher": { "@id": "https://gptshopexpert.com/#org" },
            "inLanguage": "en"
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
